<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIRGE Research Lab | Team</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .hero {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            padding: 100px 0;
        }
        
        .member-card {
            transition: all 0.3s ease;
            border: none;
        }
        
        .member-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1) !important;
        }
        
        .profile-img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border: 5px solid #fff;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .leadership-section {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">SIRGE Lab</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="#">Team</a>
                <a class="nav-link" href="#">Research</a>
                <a class="nav-link" href="#">Publications</a>
                <a class="nav-link" href="#">Events</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero text-center">
        <div class="container">
            <h1 class="display-4 fw-bold mb-3">Meet Our Team</h1>
            <p class="lead">Medical Innovation Research in AI Lab</p>
        </div>
    </section>

    <div class="container py-5">

        <!-- Leadership -->
        <h2 class="text-center mb-5 display-6">Leadership</h2>
        <div class="row justify-content-center g-4" id="leadership">
            <!-- Will be filled by JavaScript -->
        </div>

        <!-- Team Members -->
        <h2 class="text-center mb-5 display-6 mt-5">Team Members</h2>
        <div class="row g-4" id="team-members">
            <!-- Will be filled by JavaScript -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Team Data
        const teamData = {
            leadership: [
                {
                    name: "Dr. John Smith",
                    title: "Director & Principal Investigator",
                    image: "https://via.placeholder.com/300", // بعداً عوض می‌کنیم
                    profileUrl: "team/john-smith.html"
                }
            ],
            members: [
                { name: "Alice Johnson", title: "Research Scientist", image: "https://via.placeholder.com/300", profileUrl: "team/alice-johnson.html" },
                { name: "Bob Wilson", title: "AI Engineer", image: "https://via.placeholder.com/300", profileUrl: "team/bob-wilson.html" },
                { name: "Carol Davis", title: "Clinical Researcher", image: "https://via.placeholder.com/300", profileUrl: "team/carol-davis.html" },
                { name: "David Brown", title: "Data Scientist", image: "https://via.placeholder.com/300", profileUrl: "team/david-brown.html" },
                { name: "Emma Garcia", title: "Software Developer", image: "https://via.placeholder.com/300", profileUrl: "team/emma-garcia.html" },
                { name: "Frank Miller", title: "Research Assistant", image: "https://via.placeholder.com/300", profileUrl: "team/frank-miller.html" }
            ]
        };

        // Render Leadership
        function renderLeadership() {
            const container = document.getElementById('leadership');
            teamData.leadership.forEach(member => {
                const html = `
                    <div class="col-md-6 col-lg-4">
                        <div class="card member-card h-100 text-center p-4">
                            <img src="${member.image}" class="profile-img rounded-circle mx-auto mb-3" alt="${member.name}">
                            <h5 class="mb-1">${member.name}</h5>
                            <p class="text-primary mb-3">${member.title}</p>
                            <a href="${member.profileUrl}" class="btn btn-outline-primary">View Profile →</a>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        // Render Team Members
        function renderTeam() {
            const container = document.getElementById('team-members');
            teamData.members.forEach(member => {
                const html = `
                    <div class="col-md-4 col-lg-3">
                        <div class="card member-card h-100 text-center p-3">
                            <img src="${member.image}" class="profile-img rounded-circle mx-auto mb-3" alt="${member.name}">
                            <h6 class="mb-1">${member.name}</h6>
                            <p class="text-muted small mb-3">${member.title}</p>
                            <a href="${member.profileUrl}" class="btn btn-sm btn-outline-primary">View Profile</a>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        // Initialize
        renderLeadership();
        renderTeam();
    </script>
</body>
</html>
