<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.name }} | SIRGE Lab</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css">
    <meta name="theme-color" content="#7B1FA2">
    <link rel="icon" type="image/svg+xml" href="/assets/images/logo/icon.svg">
</head>

<body>
    {% include header.html %}

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="text-center mb-5">
                    <img src="{{ page.image }}" class="profile-img rounded-circle mx-auto mb-4" alt="{{ page.name }}"
                        style="width: 220px; height: 220px;">

                    <h1 class="display-5 fw-bold">{{ page.name }}</h1>
                    <h4 class="text-primary">{{ page.title }}</h4>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        {{ content }}
                    </div>
                </div>

                <!-- Links -->
                <div class="mt-4 text-center">
                    {% if page.linkedin %}<a href="{{ page.linkedin }}"
                        class="btn btn-outline-primary mx-2">LinkedIn</a>{% endif %}
                    {% if page.google_scholar %}<a href="{{ page.google_scholar }}"
                        class="btn btn-outline-primary mx-2">Google Scholar</a>{% endif %}
                    {% if page.github %}<a href="{{ page.github }}" class="btn btn-outline-primary mx-2">GitHub</a>{%
                    endif %}
                    {% if page.email %}<a href="mailto:{{ page.email }}"
                        class="btn btn-outline-primary mx-2">Email</a>{% endif %}
                </div>
            </div>
        </div>
    </div>

    {% include footer.html %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
