<div class="col-md-4 col-lg-3 mb-4">
    <div class="card member-card h-100 text-center">
        <div class="card-body">
            <img src="{{ include.image }}" class="profile-img rounded-circle mx-auto mb-3" alt="{{ include.name }}">

            <h5 class="card-title">{{ include.name }}</h5>
            <p class="text-primary mb-3">{{ include.title }}</p>

            <a href="{{ include.profile_url }}" class="btn btn-outline-primary btn-sm px-4">
                View Profile →
            </a>
        </div>
    </div>
</div>
